services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_REPLICATION_FACTOR}
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: ${KSQL_BOOTSTRAP_SERVERS}
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: ${KSQL_SERVICE_ID}
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: ${KAFKA_REPLICATION_FACTOR}
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/info"]
      interval: 10s
      timeout: 10s
      retries: 15

  ksqldb-init:
    image: confluentinc/cp-ksqldb-server:7.7.1
    depends_on:
      ksqldb-server:
        condition: service_healthy
    volumes:
      - ./ksql/init.sql:/etc/ksql/init.sql:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Submitting ksqlDB statements..."
        ksql http://ksqldb-server:8088 <<< "RUN SCRIPT '/etc/ksql/init.sql';"
        echo "ksqlDB init complete."
    restart: "no"

  producer:
    build: .
    env_file: .env.dev
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      METRICS_PORT: 8000
    command: ["python", "-m", "src.producer"]

  raw-consumer:
    build: .
    env_file: .env.dev
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      METRICS_PORT: 8001
    volumes:
      - ./output/raw:/app/output/raw
    command: ["python", "-m", "src.raw_consumer"]

  agg-sink:
    build: .
    env_file: .env.dev
    depends_on:
      ksqldb-server:
        condition: service_healthy
    environment:
      METRICS_PORT: 8002
    volumes:
      - ./output/agg:/app/output/agg
    command: ["python", "-m", "src.agg_sink"]

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    depends_on:
      kafka:
        condition: service_healthy
    command: --kafka.server=kafka:29092

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
